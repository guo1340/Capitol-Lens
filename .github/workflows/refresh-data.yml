name: Refresh Capitol Lens data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: capitol-lens-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.28.0
      - run: python scripts/refresh_web_data.py
      - name: Commit refreshed private-app snapshot
        run: |
          git config user.name "capitol-lens-data"
          git config user.email "capitol-lens-data@users.noreply.github.com"
          git add web/public/data/dataset.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Capitol Lens disclosure and price data"
            git push
          fi
